<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hexagon Base -->
  <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" fill="#0A0A0F" stroke="#00FF41" stroke-width="3"/>
  <!-- Cyber Cat Ears -->
  <polygon points="25,25 15,10 40,20" fill="#0A0A0F" stroke="#00FF41" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="75,25 85,10 60,20" fill="#0A0A0F" stroke="#00FF41" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hacker Visor (Magenta Glow) -->
  <path d="M 25 40 L 75 40 L 70 55 L 30 55 Z" fill="#FF00FF" opacity="0.8"/>
  <!-- Glowing Eyes -->
  <polygon points="30,44 45,47 30,50" fill="#00FF41" />
  <polygon points="70,44 55,47 70,50" fill="#00FF41" />
  <!-- Cyber Smirk -->
  <path d="M 40 65 L 60 65 L 50 75 Z" fill="none" stroke="#00FF41" stroke-width="2" stroke-linejoin="round"/>
  <!-- Data Nodes -->
  <circle cx="15" cy="50" r="2" fill="#00FF41"/>
  <circle cx="85" cy="50" r="2" fill="#00FF41"/>
</svg>
