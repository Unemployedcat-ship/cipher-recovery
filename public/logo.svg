  <!-- Sharp Geometric Silhouette -->
  <path d="M 10 30 L 60 5 L 110 30 L 95 85 L 60 100 L 25 85 Z" fill="#0A0A0F" stroke="url(#grad)" stroke-width="4" stroke-linejoin="round"/>
  
