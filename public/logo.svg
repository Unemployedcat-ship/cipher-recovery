<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF41" />
      <stop offset="100%" stop-color="#00B32C" />
    </linearGradient>
    <linearGradient id="visor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF00FF" />
      <stop offset="100%" stop-color="#9D00FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cyber Hood/Helmet -->
  <path d="M 50 5 L 90 25 L 80 80 L 50 95 L 20 80 L 10 25 Z" fill="#0A0A0F" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Cat Ears -->
  <polygon points="20,25 10,5 35,20" fill="#0A0A0F" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="80,25 90,5 65,20" fill="#0A0A0F" stroke="url(#neon)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cat Face Silhouette -->
  <path d="M 30 45 Q 50 35 70 45 Q 65 75 50 80 Q 35 75 30 45 Z" fill="#121217" stroke="#222228" stroke-width="1"/>

  <!-- Neon Visor -->
  <path d="M 28 45 L 72 45 L 68 58 L 32 58 Z" fill="url(#visor)" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Slanted Laser Eyes -->
  <polygon points="35,48 45,48 38,53" fill="#00FF41" />
  <polygon points="65,48 55,48 62,53" fill="#00FF41" />

  <!-- Aggressive Smirk -->
  <path d="M 40 68 L 60 68 L 50 75 Z" fill="none" stroke="url(#neon)" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
